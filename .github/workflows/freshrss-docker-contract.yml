name: FreshRSS Docker contract

# Ticket 11 (read contract) and ticket 12 (state-mutation + OPML round-trip)
# of the FreshRSS portable-state-client workstream. This proves the FreshRSS
# read, read/starred/label mutation, restart-persistence, and OPML-export
# round-trip contracts against one pinned, official FreshRSS Docker image —
# see docs/development/freshrss-docker-contract.md. It is deliberately a
# separate job from `Test` (test.yml): it needs a Docker daemon and network
# access to pull the pinned image, neither of which the ordinary
# `npm run test:unit` suite requires or should depend on.
#
# STATUS: this job has now had a successful local run against a live
# Docker daemon (see "Status of this harness" in the doc above for the
# exact date/environment) -- but that is one local run, on one machine, not
# a CI run. Watch this job's actual first CI run closely; runner-specific
# timing, network, or Docker-in-Docker differences could still surface
# something the local run did not.

on:
  push:
    branches: [main, develop]
    paths:
      - "docker/freshrss-contract/**"
      - "src/services/freshrss-*.ts"
      - ".github/workflows/freshrss-docker-contract.yml"
  pull_request:
    paths:
      - "docker/freshrss-contract/**"
      - "src/services/freshrss-*.ts"
      - ".github/workflows/freshrss-docker-contract.yml"
  workflow_dispatch:

jobs:
  freshrss-docker-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Confirm Docker is available
        run: docker version && docker compose version

      - name: Run the pinned FreshRSS Docker read/state/OPML contract
        run: npm run contract:freshrss

      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshrss-docker-contract-result
          path: docker/freshrss-contract/artifacts/
          if-no-files-found: warn
          retention-days: 30

  # Ticket 12's "previous stable image" advisory job. Deliberately a stub:
  # evaluating a genuinely different previous-stable FreshRSS image/digest
  # (resolving it, confirming the harness's assumptions still hold against
  # it, and recording its own compatibility artifact) is a real, separate
  # piece of work -- not something to do casually inside this ticket, per
  # the master spec's "updating a required image or digest requires an
  # explicit contract review, fixture run, and compatibility-matrix update"
  # rule, which applies just as much to *adding* a second tracked image as
  # to changing the primary one. This job is intentionally non-blocking
  # (`schedule`/`workflow_dispatch` only, never `push`/`pull_request`, and
  # never a dependency of the required job above) so its scaffolding exists
  # without any pretense that a previous-stable image has actually been
  # chosen or evaluated yet.
  #
  # TODO(freshrss-portable-state-client): pick a genuine previous-stable
  # FreshRSS image/digest, record it the same way docs/development/
  # freshrss-docker-contract.md documents the required pinned image, and
  # replace this stub with a real `npm run contract:freshrss`-style run
  # against it (most likely via an image override the runner script does
  # not have yet). Tracked as a known gap, not a silent omission.
  freshrss-docker-contract-previous-stable:
    runs-on: ubuntu-latest
    if: false # Remove this guard only once the TODO above is actually done.
    permissions:
      contents: read
    steps:
      - name: Not yet implemented
        run: |
          echo "Ticket 12 scaffolds this job but does not implement it -- see the TODO comment in this workflow file and docs/development/freshrss-docker-contract.md." >&2
          exit 1
