name: Test

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  # Lint, type-check, and policy checks run beside the unit tests, not before
  # them, so a pull request waits for the slower of the two instead of both.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The characterization-test guard diffs against the PR base.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Build and validate
        run: npm run build

      # Attach the built plugin so manual testers can download it from the run
      # without a rebuild. Pull requests only: pushes to dev and master do not
      # pay for the upload. The build stamp changes on every build, so name the
      # artifact by the PR and the commit that was built.
      - name: Attach the built plugin for testers
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rss-dashboard-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            main.js
            styles.css
            manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # Obsidian's community directory reads manifest.json from the default
      # branch, so dev and master must never carry a Beta version (#529).
      - name: Keep dev and master on a stable manifest version
        if: github.event_name == 'push' || github.base_ref == 'dev' || github.base_ref == 'master'
        run: node scripts/check-release-compatibility.mjs --stable-branch

      - name: Keep characterization tests read-only on refactor PRs
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-characterization-tests.mjs "origin/$BASE_REF"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        env:
          TZ: America/Los_Angeles
        run: npm run test:unit -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: rss-dashboard

  # Windows-only path-case bugs (#1319) cannot show on Ubuntu, where the launch
  # path and the disk path already agree. Run only the main-folder tests and the
  # pre-commit hook's related selection, launched by script path exactly as
  # `.githooks/pre-commit` does; the full suite stays on Ubuntu (#1321).
  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the main-folder unit tests
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.mjs test_files/unit/main

      # `--passWithNoTests` mirrors the hook, which exits 0 when nothing is
      # selected. Fail here instead, so the check cannot quietly stop covering
      # anything.
      - name: Run the related-test selection
        run: |
          set -o pipefail
          node node_modules/vitest/vitest.mjs related --run --passWithNoTests --config vitest.config.mjs src/settings/tabs/general-settings-tab.ts | tee related.log
          if grep -q "No test files found" related.log; then
            echo "::error::vitest related selected no test files"
            exit 1
          fi
