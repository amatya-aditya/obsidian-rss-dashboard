name: Test

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The characterization-test guard diffs against the PR base.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Build and validate
        run: npm run build

      # Obsidian's community directory reads manifest.json from the default
      # branch, so dev and master must never carry a Beta version (#529).
      - name: Keep dev and master on a stable manifest version
        if: github.event_name == 'push' || github.base_ref == 'dev' || github.base_ref == 'master'
        run: node scripts/check-release-compatibility.mjs --stable-branch

      - name: Keep characterization tests read-only on refactor PRs
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-characterization-tests.mjs "origin/$BASE_REF"

      - name: Run tests with coverage
        env:
          TZ: America/Los_Angeles
        run: npm run test:unit -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: rss-dashboard
