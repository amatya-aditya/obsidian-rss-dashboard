version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # master takes no direct commits: it receives merged release branches
    # only, and every commit on it is a tagged release (see AGENTS.md and
    # CONTRIBUTING.md). Without this, dependabot targets the repository
    # default branch, which is master.
    target-branch: "dev"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
