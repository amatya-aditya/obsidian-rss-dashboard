version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # Version updates land on dev. master is the default branch: it takes no
    # direct commits and receives merged release branches only (see AGENTS.md and
    # CONTRIBUTING.md). target-branch keeps version updates going to dev. Security
    # update PRs open against the default branch anyway; retarget them to dev or
    # close them, do not merge them into master.
    target-branch: "dev"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions are planned upgrades, not automatic PRs (see issue #512).
    # Security updates still arrive: ignore rules apply to version updates only.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # vitest and its plugins pin each other exactly, so they must update
      # together. A dependency joins the first group it matches, so this
      # group stays above the catch-all.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
