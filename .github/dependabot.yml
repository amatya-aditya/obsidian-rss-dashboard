version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # Dependency updates land on dev, the default branch. master takes no
    # direct commits: it receives merged release branches only, and every
    # commit on it is a tagged release (see AGENTS.md and CONTRIBUTING.md).
    # target-branch stays explicit so updates keep going to dev even if the
    # default branch changes again.
    target-branch: "dev"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions are planned upgrades, not automatic PRs (see issue #512).
    # Security updates still arrive: ignore rules apply to version updates only.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # vitest and its plugins pin each other exactly, so they must update
      # together. A dependency joins the first group it matches, so this
      # group stays above the catch-all.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
